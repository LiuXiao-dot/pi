<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#0d1525" />
		<title>pi Hub</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@8..144,250;8..144,300;8..144,400;8..144,500&family=JetBrains+Mono:wght@400&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/src/style.css" />
	</head>
	<body>
		<div id="loading-screen" class="loading-screen">
			<div class="loading-logo">
				<img class="loading-logo-img" src="./assets/logo-head.png" alt="pi"
					onerror="this.style.display='none';this.nextElementSibling.style.display=''" />
				<div class="loading-logo-inner" style="display:none">&pi;</div>
			</div>
			<div class="loading-bar-track">
				<div class="loading-bar-fill"></div>
			</div>
			<div class="loading-text">Loading pi Hub</div>
		</div>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
